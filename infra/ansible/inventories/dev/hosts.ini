[app_servers]
spotbot-app-dev-1 ansible_host=<SERVER_IP> ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3

[app_servers:vars]
environment=dev
domain=dev.spotbot.example.com

# Database connection (from Tofu output)
db_host=<DB_HOST>
db_port=25060
db_name=spotbot_dev
db_user=spotbot_user
db_password=<DB_PASSWORD>

# Redis connection
redis_host=<REDIS_HOST>
redis_port=25061
redis_password=<REDIS_PASSWORD>

# Security
secret_key=<GENERATE_RANDOM_SECRET>
jwt_secret=<GENERATE_RANDOM_JWT_SECRET>

# Optional API keys
openai_api_key=
anthropic_api_key=
sentry_dsn=
